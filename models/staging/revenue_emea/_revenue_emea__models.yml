        description: "{{ doc('stg_revenue_emea__partner_created_at') }}"

      - name: partner_first_transaction_at
        description: "{{ doc('stg_revenue_emea__partner_first_transaction_at') }}"

  - name: stg_revenue_emea__currencies
    description: "{{ doc('stg_revenue_emea__currencies') }}"
    columns:
      - name: currency_key
        description: "{{ doc('stg_revenue_emea__currency_key') }}"
        data_tests:
