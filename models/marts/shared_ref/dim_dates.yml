version: 2

models:
  - name: dim_dates
    description: "{{ doc('shared_ref__dim_dates') }}"
    columns:
      - name: date_key
        description: "{{ doc('stg_revenue_emea__date_key') }}"
        data_tests:
          - unique
          - not_null

      - name: date_day
        description: "{{ doc('stg_revenue_emea__date_day') }}"

      - name: first_day_of_month
        description: "{{ doc('stg_revenue_emea__first_day_of_month') }}"

      - name: last_day_of_month
        description: "{{ doc('stg_revenue_emea__last_day_of_month') }}"

      - name: year_number
        description: "{{ doc('stg_revenue_emea__year_number') }}"

