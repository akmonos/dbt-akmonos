      - name: month_year_label
        description: "{{ doc('stg_revenue_emea__month_year_label') }}"

      - name: is_weekday
        description: "{{ doc('stg_revenue_emea__is_weekday') }}"

      - name: is_first_day_of_month
        description: "{{ doc('stg_revenue_emea__is_first_day_of_month') }}"