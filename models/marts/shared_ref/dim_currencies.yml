version: 2

models:
  - name: dim_currencies
    description: "{{ doc('shared_ref__dim_currencies') }}"
    semantic_model:
      enabled: true
    columns:
      - name: currency_key
        description: "{{ doc('stg_revenue_emea__currency_key') }}"
        entity:
          type: primary
          name: currency
        data_tests:
          - unique
          - not_null

      - name: currency_api_code
        description: "{{ doc('stg_revenue_emea__currency_api_code') }}"
        dimension:
          type: categorical
