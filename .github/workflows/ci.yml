# CI: build only changed models (slim) on every pull request, full build when no prod manifest exists
name: dbt CI

on:
  pull_request:
    branches:
      - main

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-core==1.12.3 dbt-snowflake

      - name: Install dbt packages
        run: dbt deps

      - name: Find latest deploy run
        id: deploy_run
        run: |
          run_id=$(gh run list --workflow deploy.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download prod manifest
        if: steps.deploy_run.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: prod-manifest
          github-token: ${{ github.token }}
          run-id: ${{ steps.deploy_run.outputs.run_id }}
          path: state

      - name: Build and test
        run: |
          if [ -f state/manifest.json ]; then
            dbt build --profiles-dir ci --target ci --select state:modified+ --defer --state state
          else
            dbt build --profiles-dir ci --target ci --exclude package:dbt_snowflake_monitoring
          fi
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}