# CI profile: GitHub Actions connects to Snowflake with credentials from repo secrets
dbt_akmonos:
  target: ci
  outputs:
    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      #user: "{{ env_var('SNOWFLAKE_USER') }}"
      #password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      user: "{{ env_var('SNOWFLAKE_CI_USER') }}"
      private_key: "{{ env_var('SNOWFLAKE_CI_PRIVATE_KEY') }}"
      role: accountadmin
      database: dev
      schema: ci
      warehouse: dbt_xs_wh
      threads: 4

    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      #user: "{{ env_var('SNOWFLAKE_USER') }}"
      #password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      user: "{{ env_var('SNOWFLAKE_CI_USER') }}"
      private_key: "{{ env_var('SNOWFLAKE_CI_PRIVATE_KEY') }}"  
      role: accountadmin
      database: prod_transformed
      schema: staging
      warehouse: dbt_xs_wh
      threads: 4