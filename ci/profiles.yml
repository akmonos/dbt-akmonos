# CI profile: GitHub Actions connects to Snowflake DEV with credentials from repo secrets
dbt_akmonos:
  target: ci
  outputs:
    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: accountadmin
      database: dev
      schema: ci
      warehouse: dbt_xs_wh
      threads: 4